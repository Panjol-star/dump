name: Dump Firmware with DumprX

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Firmware link (direct link / mega.nz / mediafire / gdrive / androidfilehost)'
        required: true
        type: string

# Prevent two dumps from running at once and filling up disk
concurrency:
  group: dumprx
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # large firmware dumps can take a while; default job limit is 360 minutes

    steps:
      - name: Clone DumprX
        run: |
          git clone --depth=1 https://github.com/DumprX/DumprX.git
          cd DumprX
          echo "DUMPRX_DIR=$(pwd)" >> "$GITHUB_ENV"
          
      - name: Install uv (provides uvx)
        uses: astral-sh/setup-uv@v3
        
      - name: Install aospdtgen
        run: uv tool install aospdtgen

      - name: Run setup.sh (install dependencies)
        working-directory: ${{ env.DUMPRX_DIR }}
        run: |
          chmod +x setup.sh dumper.sh
          sudo ./setup.sh

      - name: Configure git identity
        run: |
          git config --global user.name "Panjol-star"
          git config --global user.email "263357069+Panjol-star@users.noreply.github.com"

      - name: Set up upload credentials (GitHub token & org)
        working-directory: ${{ env.DUMPRX_DIR }}
        env:
          GH_TOKEN_SECRET: ${{ secrets.DUMPER_GH_TOKEN }}
          GH_ORGNAME_SECRET: ${{ secrets.DUMPER_GH_ORGNAME }}
          TG_TOKEN_SECRET: ${{ secrets.DUMPER_TG_TOKEN }}
          TG_CHAT_SECRET: ${{ secrets.DUMPER_TG_CHAT }}
        run: |
          if [ -n "$GH_TOKEN_SECRET" ]; then
            echo "$GH_TOKEN_SECRET" > .github_token
          fi
          if [ -n "$GH_ORGNAME_SECRET" ]; then
            echo "$GH_ORGNAME_SECRET" > .github_orgname
          fi
          if [ -n "$TG_TOKEN_SECRET" ]; then
            echo "$TG_TOKEN_SECRET" > .tg_token
          fi
          if [ -n "$TG_CHAT_SECRET" ]; then
            echo "$TG_CHAT_SECRET" > .tg_chat
          fi
    
      - name: Validate GitHub Token & Target Repository
        working-directory: ${{ env.DUMPRX_DIR }}
        env:
          GH_TOKEN: ${{ secrets.DUMPER_GH_TOKEN }}
          GH_ORG: ${{ secrets.DUMPER_GH_ORGNAME }}
        run: |
          echo "==> Checking GitHub Token validity..."
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: DUMPER_GH_TOKEN secret is empty or not set!"
            exit 1
          fi
          
          # 1. Login & tes token
          echo "$GH_TOKEN" | gh auth login --with-token
          if ! gh auth status; then
            echo "Error: GitHub token authentication failed!"
            exit 1
          fi

          # 2. Tentukan target owner (Org name atau Username pemilik token)
          if [ -n "$GH_ORG" ]; then
            TARGET_OWNER="$GH_ORG"
          else
            TARGET_OWNER=$(gh api user -q '.login')
          fi

          echo "==> Checking target repository access under target: $TARGET_OWNER..."
          
          # Ambil nama repo dari firmware / dump target jika memungkinkan, 
          # atau tes akses umum ke API repo owner
          if gh api "users/$TARGET_OWNER" >/dev/null 2>&1 || gh api "orgs/$TARGET_OWNER" >/dev/null 2>&1; then
            echo "Success: Target owner '$TARGET_OWNER' exists and token has access!"
          else
            echo "Error: Cannot access user/org '$TARGET_OWNER'. Check token permissions or DUMPER_GH_ORGNAME."
            exit 1
          fi
          
      - name: Run the dumper
        working-directory: ${{ env.DUMPRX_DIR }}
        run: |
          ./dumper.sh '${{ inputs.firmware_url }}'
